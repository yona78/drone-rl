name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Sync dependencies
      run: uv sync --all-groups

    - name: Run ruff check
      run: uv run ruff check src/ tests/

    - name: Run ruff format check
      run: uv run ruff format --check src/ tests/ notebooks/

    - name: Run tests with coverage
      run: uv run pytest --tb=short -p no:cov -o "addopts=" -q

    - name: Verify file sizes
      run: |
        echo "Checking file sizes (max 150 lines)..."
        find src/ tests/ -name "*.py" -exec sh -c 'lines=$(wc -l < "$1"); if [ "$lines" -gt 150 ]; then echo "❌ $1: $lines lines (exceeds 150)"; exit 1; fi' _ {} \;
        echo "✅ All files within 150-line limit"
